<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Countdown Timer</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; } body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; } .timer-box { text-align: center; background-color: #1e293b; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); border: 1px solid #334155; width: 90%; max-width: 400px; } h1 { font-size: 1.5rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.5rem; } .time-display { font-size: 5rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 2rem; color: #38bdf8; outline: none; border-bottom: 2px dashed rgba(56,189,248,0.3); cursor: pointer; display: inline-block; padding: 0 0.5rem; } .time-display:focus { border-bottom-color: #38bdf8; background-color: rgba(30,41,59,0.5); } .controls { display: flex; gap: 1rem; } button { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 0.5rem; cursor: pointer; flex: 1; color: white; transition: background 0.2s; } #startBtn { background-color: #10b981; } #startBtn:hover { background-color: #059669; } #pauseBtn { background-color: #f59e0b; display: none; } #pauseBtn:hover { background-color: #d97706; } #resetBtn { background-color: #ef4444; } #resetBtn:hover { background-color: #dc2626; } </style> </head> <body> <div class="timer-box"> <h1>Timer</h1> <div class="time-display" id="display" contenteditable="true" spellcheck="false">05:00</div> <div class="controls"> <button id="startBtn">Start</button> <button id="pauseBtn">Pause</button> <button id="resetBtn">Reset</button> </div> </div> <audio id="alarm" src="https://mixkit.co" preload="auto" loop></audio> <script> let baseSec = 300, leftSec = baseSec, interval = null; const disp = document.getElementById('display'), startB = document.getElementById('startBtn'), pauseB = document.getElementById('pauseBtn'), resetB = document.getElementById('resetBtn'), audio = document.getElementById('alarm'); function upDisp() { const m = String(Math.floor(leftSec / 60)).padStart(2, '0'), s = String(leftSec % 60).padStart(2, '0'); disp.textContent = `${m}:${s}`; } function parseIn() { const p = disp.textContent.split(':'); baseSec = p.length === 2 ? (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0) : parseInt(disp.textContent, 10) || 0; leftSec = Math.max(0, baseSec); disp.style.color = '#38bdf8'; upDisp(); } function fallbackBeep() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(), gain = ctx.createGain(); osc.type = 'square'; osc.frequency.value = 600; gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.4); } catch(e) {} } function playAlarm() { audio.play().catch(() => { fallbackBeep(); window.fBId = setInterval(fallbackBeep, 600); }); } function stopAlarm() { audio.pause(); audio.currentTime = 0; if (window.fBId) { clearInterval(window.fBId); window.fBId = null; } } startB.addEventListener('click', () => { if (interval) return; startB.style.display = 'none'; pauseB.style.display = 'inline-block'; stopAlarm(); try { new (window.AudioContext || window.webkitAudioContext)().resume(); } catch(e) {} interval = setInterval(() => { if (leftSec > 0) { leftSec--; upDisp(); } else { clearInterval(interval); interval = null; disp.style.color = '#ef4444'; startB.style.display = 'inline-block'; pauseB.style.display = 'none'; playAlarm(); } }, 1000); }); pauseB.addEventListener('click', () => { clearInterval(interval); interval = null; startB.style.display = 'inline-block'; pauseB.style.display = 'none'; }); resetB.addEventListener('click', () => { clearInterval(interval); interval = null; stopAlarm(); leftSec = baseSec; disp.style.color = '#38bdf8'; upDisp(); startB.style.display = 'inline-block'; pauseB.style.display = 'none'; }); disp.addEventListener('focus', () => { clearInterval(interval); interval = null; startB.style.display = 'inline-block'; pauseB.style.display = 'none'; }); disp.addEventListener('blur', parseIn); disp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); disp.blur(); } }); upDisp(); </script> </body> </html>
