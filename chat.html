<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>OBS Twitch Chat Browser Source with Emotes</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body, html { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } #chat-container { display: flex; flex-direction: column; justify-content: flex-end; width: 100vw; height: 100vh; padding: 20px; gap: 10px; } .chat-message { display: block; animation: fadeInUp 0.3s ease-out forwards; background: rgba(15, 23, 42, 0.65); border-left: 4px solid #9146ff; padding: 10px 14px; border-radius: 0 8px 8px 0; color: #f8fafc; font-size: 1.25rem; font-weight: 500; line-height: 1.5; max-width: 600px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); word-wrap: break-word; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: opacity 1s ease-out; } .username { font-weight: 700; margin-right: 8px; color: #38bdf8; display: inline-block; vertical-align: middle; } .text { color: #e2e8f0; display: inline; vertical-align: middle; } .twitch-emote { display: inline-block; vertical-align: middle; height: 1.8rem; margin: -2px 2px 0 2px; } .fade-out { opacity: 0; } @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } </style> </head> <body> <div id="chat-container"></div> <script> const TWITCH_CHANNEL = 'OneManMedia'.toLowerCase(); const MAX_MESSAGES = 17; const MESSAGE_LIFETIME_MS = 90000; const container = document.getElementById('chat-container'); const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443'); function getRandomColor() { const colors = ['#38bdf8', '#34d399', '#f472b6', '#fbbf24', '#f87171', '#a78bfa', '#2dd4bf']; return colors[Math.floor(Math.random() * colors.length)]; } function escapeHTML(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); } ws.onopen = () => { ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'); ws.send('PASS oauth:blank'); ws.send('NICK justinfan12345'); ws.send(`JOIN #${TWITCH_CHANNEL}`); console.log(`Connected to channel: ${TWITCH_CHANNEL}`); }; ws.onmessage = (event) => { const msg = event.data; if (msg.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; } if (!msg.includes('PRIVMSG')) return; const parts = msg.split(' PRIVMSG #' + TWITCH_CHANNEL + ' :'); if (parts.length < 2) return; let rawMessage = parts.slice(1).join(' PRIVMSG #' + TWITCH_CHANNEL + ' :').trim(); rawMessage = rawMessage.replace(/^\u0001ACTION\s|\u0001$/g, ''); const tagsPart = parts[0]; let displayName = 'Anonymous'; const nameMatch = tagsPart.match(/display-name=([^; \s]+)/); if (nameMatch) displayName = nameMatch[1]; let userColor = getRandomColor(); const colorMatch = tagsPart.match(/color=#([0-9A-Fa-f]{6})/); if (colorMatch) userColor = `#${colorMatch[1]}`; let parsedText = escapeHTML(rawMessage); const emotesMatch = tagsPart.match(/emotes=([^; ]+)/); if (emotesMatch && emotesMatch[1]) { const encoder = new TextEncoder(); const decoder = new TextDecoder(); const rawBytes = encoder.encode(rawMessage); emotesMatch[1].split('/').forEach(emoteStr => { const eParts = emoteStr.split(':'); if (eParts.length === 2) { const id = eParts[0]; const firstPos = eParts[1].split(',')[0]; const coords = firstPos.split('-'); if (coords.length === 2) { const start = parseInt(coords[0], 10); const end = parseInt(coords[1], 10); const emoteBytes = rawBytes.slice(start, end + 1); const emoteWord = decoder.decode(emoteBytes); if (emoteWord) { const escapedWord = escapeHTML(emoteWord).replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); const regex = new RegExp('\\b' + escapedWord + '\\b', 'g'); parsedText = parsedText.replace(regex, `<img class="twitch-emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0" alt="${escapeHTML(emoteWord)}">`); } } } }); } createMessageElement(displayName, parsedText, userColor); }; function createMessageElement(username, htmlContent, color) { const messageDiv = document.createElement('div'); messageDiv.className = 'chat-message'; const userSpan = document.createElement('span'); userSpan.className = 'username'; userSpan.textContent = username; userSpan.style.color = color; const textSpan = document.createElement('span'); textSpan.className = 'text'; textSpan.innerHTML = htmlContent; messageDiv.appendChild(userSpan); messageDiv.appendChild(textSpan); container.appendChild(messageDiv); if (container.children.length > MAX_MESSAGES) { container.removeChild(container.firstChild); } setTimeout(() => { messageDiv.classList.add('fade-out'); setTimeout(() => { if (messageDiv.parentNode === container) { container.removeChild(messageDiv); } }, 1000); }, MESSAGE_LIFETIME_MS); } ws.onclose = () => { setTimeout(() => { window.location.reload(); }, 5000); }; </script> </body> </html>
