<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Stream Monitor</title><style>body{font-family:'Segoe UI',sans-serif;background:#090d16;color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}#stream-canvas-container{width:90vmin;aspect-ratio:16/9;background:#1e293b;border:2px solid #334155;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 20px 25px -5px rgba(0,0,0,.3);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:10px}video{width:100%;height:100%;object-fit:cover;background:#000;border-radius:6px;border:2px solid #a855f7}.source-wrapper{position:relative;width:100%;height:100%}.source-label{position:absolute;bottom:10px;left:10px;background:rgba(15,23,42,.75);padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#f8fafc}</style></head><body><h1>🎬 Live Output Target Canvas</h1><div id="stream-canvas-container"></div><script>const controlChannel=new BroadcastChannel("stream_control");let activeHardwareStreams={};controlChannel.onmessage=async e=>{const{command:t,value:n}=e.data;"SYNC_PRODUCTION"===t&&await processActiveLayoutState(n)};async function processActiveLayoutState(e){const t=document.getElementById("stream-canvas-container");const n=new Set(Object.keys(e.sources));for(const e of Object.keys(activeHardwareStreams)){if(!n.has(e)||!e.sources[e].visible){if(window[e+"_stream"]){window[e+"_stream"].getTracks().forEach(t=>t.stop());delete window[e+"_stream"]}const t=document.getElementById(e+"_container");t&&t.remove();delete activeHardwareStreams[e]}}for(const[n,a]of Object.entries(e.sources)){if(a.visible){let e=document.getElementById(n+"_video");if(!e){const r=document.createElement("div");r.id=n+"_container",r.className="source-wrapper",r.innerHTML=`<video id="${n}_video" autoplay playsinline muted></video><div class="source-label">${a.name}</div>`,t.appendChild(r),e=document.getElementById(n+"._video")}if(activeHardwareStreams[n]!==a.deviceId){await startHardwareCapture(n,a.deviceId);activeHardwareStreams[n]=a.deviceId}}else{if(window[n+"_stream"]){window[n+"_stream"].getTracks().forEach(e=>e.stop());delete window[n+"_stream"]}const e=document.getElementById(n+"_container");e&&e.remove();delete activeHardwareStreams[n]}}}async function startHardwareCapture(layerId,deviceId){try{if(window[layerId+"_stream"]){window[layerId+"_stream"].getTracks().forEach(e=>e.stop())}const stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:deviceId},width:1280,height:720}});window[layerId+"_stream"]=stream;const videoEl=document.getElementById(layerId+"_video");if(videoEl)videoEl.srcObject=stream}catch(err){console.error("Hardware streaming connection failed:",err)}}window.addEventListener("DOMContentLoaded",()=>{controlChannel.postMessage({command:"REQUEST_SYNC",value:!0})});</script></body></html>
