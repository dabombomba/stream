<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Stream Canvas</title><style>*{box-sizing:border-box;margin:0;padding:0}body,html{width:100%;height:100%;background:#090d16;overflow:hidden;display:flex;align-items:center;justify-content:center}#canvas-wrapper{width:100vmin;aspect-ratio:16/9;position:relative;background:#000;box-shadow:0 25px 50px -12px rgba(0,0,0,.55);overflow:hidden}.source-element{position:absolute;transition:all .2s ease-out;border:0;object-fit:cover;display:none}</style></head><body><div id="canvas-wrapper"><video id="game-feed-element" class="source-element" autoplay playsinline muted></video><video id="webcam-feed-element" class="source-element" autoplay playsinline muted></video><iframe id="twitch-alertbox-element" class="source-element" src="about:blank" allow="autoplay; camera; microphone"></iframe></div><script>const WORKER_URL="https://your-worker-name.workers.dev",controlChannel=new BroadcastChannel("stream_control");let peerConnection=null,masterStream=null,activeVideoStreams={};controlChannel.onmessage=async e=>{const{command:t,value:n}=e.data;"SYNC_PRODUCTION"===t&&renderActiveState(n),"START_BROADCAST"===t&&goLiveViaWHIP()};async function renderActiveState(e){const{activeScene:t,scenes:n,sources:a,hardwareConfig:r}=e,o=n[t];if(o)for(const[e,t]of Object.entries(o)){const n=document.getElementById(e+"-element");if(n){const o=a[e];if(o&&o.visible&&t.visible){n.style.display="block",n.style.top=t.top+"%",n.style.left=t.left+"%",n.style.width=t.width+"%",n.style.height=t.height+"%",n.style.opacity=t.opacity,n.style.zIndex=t.zIndex;if("webcam-feed"===e&&r.selectedCamera&&activeVideoStreams.camera!==r.selectedCamera)await mountHardwareDevice("webcam-feed-element",r.selectedCamera,"camera");else if("game-feed"===e&&r.selectedCaptureCard&&activeVideoStreams.captureCard!==r.selectedCaptureCard)await mountHardwareDevice("game-feed-element",r.selectedCaptureCard,"captureCard");"twitch-alertbox"===e&&n.src!==o.url&&""!==o.url&&(n.src=o.url)}else n.style.display="none"}}}async function mountHardwareDevice(e,t,n){try{if(window[n+"Track"]){window[n+"Track"].getTracks().forEach(e=>e.stop())}const a=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:t},width:1920,height:1080}});window[n+"Track"]=a,document.getElementById(e).srcObject=a,activeVideoStreams[n]=t}catch(e){console.error("Hardware mounting failed:",t,e)}}async function goLiveViaWHIP(){try{const e=document.getElementById("canvas-wrapper");masterStream=e.captureStream?e.captureStream(30):e.mozCaptureStream(30),peerConnection=new RTCPeerConnection({iceServers:[{urls:"stun:://google.com"}]}),masterStream.getVideoTracks().forEach(e=>peerConnection.addTrack(e,masterStream));const t=await peerConnection.createOffer();await peerConnection.setLocalDescription(t);const n=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/sdp"},body:t.sdp});if(!n.ok)throw new Error("Handshake rejected");const a=await n.text();await peerConnection.setRemoteDescription(new RTCSessionDescription({type:"answer",sdp:a})),controlChannel.postMessage({command:"STATUS_UPDATE",value:"LIVE"})}catch(e){controlChannel.postMessage({command:"STATUS_UPDATE",value:"ERROR"})}}</script></body></html>
