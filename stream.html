<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Stream Monitor</title><style>body{font-family:'Segoe UI',sans-serif;background:#090d16;color:#fff;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}#monitor-canvas{width:600px;background:#1e293b;border:2px solid #334155;border-radius:12px;padding:30px;box-shadow:0 20px 25px -5px rgba(0,0,0,.3)}.source-row{display:flex;justify-content:space-between;background:#131b2e;padding:12px 20px;border-radius:8px;margin-bottom:10px;font-size:16px;font-weight:600}.status-pill{padding:4px 12px;border-radius:20px;font-size:12px;text-transform:uppercase}.online{background:#22c55e;color:#fff}.offline{background:#ef4444;color:#fff}</style></head><body><h1>🎬 Live Stream Monitor Target</h1><p style="color:#64748b;margin-bottom:20px">This page updates instantly when you press toggle buttons on your dashboard.</p><div id="monitor-canvas"><div id="incoming-data-box">Awaiting connection sync from dashboard...</div></div><script>const controlChannel=new BroadcastChannel("stream_control");controlChannel.onmessage=e=>{const{command:t,value:n}=e.data;"SYNC_PRODUCTION"===t&&updateMonitorDisplay(n)};function updateMonitorDisplay(e){const t=document.getElementById("incoming-data-box");t.innerHTML="";for(const[n,a]of Object.entries(e.sources)){const r=document.createElement("div");r.className="source-row",r.innerHTML=`<span>${a.name}</span><span class="status-pill ${a.visible?'online':'offline'}">${a.visible?'Active':'Hidden'}</span>`,t.appendChild(r)}}window.addEventListener("DOMContentLoaded",()=>{controlChannel.postMessage({command:"REQUEST_SYNC",value:!0})});</script></body></html>
