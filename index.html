<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Studio Deck - Fullscreen Stacking Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: grid; grid-template-columns: 360px 1fr; gap: 20px; height: 100vh; }
        #control-panel { display: flex; flex-direction: column; gap: 15px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; overflow-y: auto; }
        #live-viewport-container { display: flex; align-items: center; justify-content: center; background: #090d16; border-radius: 8px; border: 1px solid #1e293b; position: relative; }
        
        /* Strict 16:9 Master 1080p Composition Boundary Container Box */
        #master-stream-viewport { 
            width: 100%; 
            max-width: 1024px; 
            aspect-ratio: 16/9; 
            position: relative; 
            background: #000; 
            overflow: hidden; 
        }
        #bg-gif-layer { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; opacity:0.01}
        
        /* FIX: Injected layers are automatically centered, borderless, and locked to full-screen 1080p bounds */
        .overlay-frame { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: transparent;
        }
        
        h2 { font-size: 13px; color: #a855f7; text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-top: 10px; }
        input[type=text], select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 10px; }
        audio { width: 100%; margin-bottom: 10px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 5px; }
        button:hover { background: #2563eb; }
        .danger-btn { background: #ef4444; padding: 4px 8px; font-size: 11px; width: auto; margin-bottom: 0; }
        .danger-btn:hover { background: #dc2626; }
        .success-btn { background: #22c55e; margin-top: auto; padding: 12px; }
        .success-btn:hover { background: #16a34a; }
        
        /* Visual tracker row for active layers currently stacked on your stream */
        .layer-item { background: #131b2e; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .layer-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
    </style>
</head>
<body>
    <div id="control-panel">
        <h2>1. Base Background Ingestion</h2>
        <!-- Hardcoded text value inside the input box baseline -->
        <input type="text" id="gifUrlInput" placeholder="Paste Background GIF URL..." value="https://github.io" onchange="updateBackgroundGif(this.value)">
        <audio id="bg-music-player" src="https://dabombomba.github.io/stream/music.wav" controls loop></audio>

        <h2>2. Web Overlay Injection (16:9 Fullscreen)</h2>
        <input type="text" id="overlayNameInput" placeholder="Layer Label (e.g., Chat, Alerts)...">
        <input type="text" id="overlayUrlInput" placeholder="https://github.io">
        <button onclick="injectFullscreenWebOverlay()">🔌 Inject Stacked Layer</button>

        <h2>3. Active Production Stacking Vault</h2>
        <div id="active-layers-bank">
            <!-- Injected layers stack list renders here dynamically -->
        </div>

        <button id="liveBtn" class="success-btn" onclick="startWhipStreaming()">🚀 GO LIVE VIA WORKER</button>
    </div>

    <div id="live-viewport-container">
        <div id="master-stream-viewport">
            <!-- Hardcoded true default source target path background layer link -->
            <img id="bg-gif-layer" src="https://dabombomba.github.io/stream/image.GIF" alt="Background Loop">
        </div>
    </div>
        <script>
        // 1. YOUR IMMUTABLE CONFIGURATION PATHS
        const WORKER_URL = "https://omm.jacksonhazlett.workers.dev/";
        
        // Hardcodes your active production asset warehouse records directly into boot memory
        let stackedOverlaysRegistry = [
            { id: "layer-logo", name: "OMM Logo PNG", url: "dabombomba.github.io/stream/OMM.png" },
            { id: "layer-chat", name: "Live Chat Box HTML", url: "dabombomba.github.io/stream/chat.html" }
        ];

        function updateBackgroundGif(url) {
            if(url) document.getElementById("bg-gif-layer").src = url;
        }

        // 2. AUTOMATED FULL-SCREEN INJECTION PIPELINE
        function createDOMSourceNode(uniqueLayerId, url) {
            const viewport = document.getElementById("master-stream-viewport");
            const isImageFile = /\.(jpg|jpeg|png|gif|webp|svg)/i.test(url);
            let targetSourceElement;

            if (isImageFile) {
                // Instantiates a native picture node to lock in alpha transparency parameters cleanly
                targetSourceElement = document.createElement("img");
                targetSourceElement.src = url;
            } else {
                // Instantiates an interactive web channel layer for scrolling live text widgets
                targetSourceElement = document.createElement("iframe");
                targetSourceElement.src = url;
                targetSourceElement.allow = "autoplay";
            }

            targetSourceElement.id = uniqueLayerId;
            targetSourceElement.className = "overlay-frame";
            viewport.appendChild(targetSourceElement);
        }

        function injectFullscreenWebOverlay() {
            const nameInput = document.getElementById("overlayNameInput");
            const urlInput = document.getElementById("overlayUrlInput");
            const name = nameInput.value.trim() || `Overlay Track ${stackedOverlaysRegistry.length + 1}`;
            const url = urlInput.value.trim();

            if (!url) {
                alert("Please provide a valid web overlay asset URL link.");
                return;
            }

            const uniqueLayerId = "layer-" + Date.now();
            
            createDOMSourceNode(uniqueLayerId, url);
            stackedOverlaysRegistry.push({ id: uniqueLayerId, name: name, url: url });

            nameInput.value = "";
            urlInput.value = "";
            renderActiveLayersBankUI();
        }

        function removeStackedLayer(layerId) {
            const element = document.getElementById(layerId);
            if (element) element.remove();
            stackedOverlaysRegistry = stackedOverlaysRegistry.filter(layer => layer.id !== layerId);
            renderActiveLayersBankUI();
        }

                // FIX: Manual soft-refresh button pipeline resets the source asset target without dropping canvas frames
        function refreshSingleLayer(layerId) {
            const targetElement = document.getElementById(layerId);
            if (!targetElement) return;

            console.log(`Manually refreshing target production layer ID: ${layerId}`);

            if (targetElement.tagName === "IFRAME") {
                // Soft-reload the iframe source pointer seamlessly
                const currentSourceUrl = targetElement.src;
                targetElement.src = "";
                targetElement.src = currentSourceUrl;
            } else if (targetElement.tagName === "IMG") {
                // Bust the browser image cache by appending a micro timestamp query parameter
                const baseSrc = targetElement.src.split('?')[0];
                targetElement.src = baseSrc + "?t=" + Date.now();
            }
        }

        function renderActiveLayersBankUI() {
            const bankContainer = document.getElementById("active-layers-bank");
            bankContainer.innerHTML = "";

            if (stackedOverlaysRegistry.length === 0) {
                bankContainer.innerHTML = `<span style="font-size:11px; color:#64748b; font-style:italic;">No custom web sources injected yet.</span>`;
                return;
            }

            // Loop through entries to paint your active layer status nodes list with control buttons
            stackedOverlaysRegistry.forEach((layer, index) => {
                const row = document.createElement("div");
                row.className = "layer-item";
                
                // FIX: Injects an individual manual 🔄 Refresh button alongside your layer tracking rows
                row.innerHTML = `
                    <span class="layer-name" style="max-width: 140px;">#${index + 1} [${layer.name}]</span>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="refreshSingleLayer('${layer.id}')" style="background: #1e293b; border: 1px solid #475569; padding: 4px 8px; font-size: 11px; width: auto; margin-bottom: 0;">🔄 Refresh</button>
                        <button class="danger-btn" onclick="removeStackedLayer('${layer.id}')">🗑️ Remove</button>
                    </div>
                `;
                bankContainer.appendChild(row);
            });
        }

        // 3. SYSTEM AUTOMATION STARTUP TRIGGERS
        function initializeHardcodedProductionSuite() {
            stackedOverlaysRegistry.forEach(layer => {
                createDOMSourceNode(layer.id, layer.url);
            });
            renderActiveLayersBankUI();
        }

        // Hooks your hardcoded array straight into the initial page load cycle sequence
        window.addEventListener("DOMContentLoaded", initializeHardcodedProductionSuite);


        // 4. HIGH-PERFORMANCE TRANSMISSION MEDIA PIPELINE (Left Unchanged)
        async function startWhipStreaming() {
            const btn = document.getElementById("liveBtn");
            btn.disabled = true;
            btn.textContent = "TRANSMITTING TO WORKER...";
            try {
                const viewport = document.getElementById("master-stream-viewport");
                const captureCanvas = document.createElement("canvas");
                captureCanvas.width = 1920;
                captureCanvas.height = 1080;
                const ctx = captureCanvas.getContext("2d");
                const gifElement = document.getElementById("bg-gif-layer");

                function compositeBufferLoop() {
                    if (btn.textContent === "🔴 STREAM ONLINE" || btn.textContent === "TRANSMITTING TO WORKER...") {
                        requestAnimationFrame(compositeBufferLoop);
                    }
                    try {
                        ctx.drawImage(gifElement, 0, 0, 1920, 1080);
                    } catch(e) {}
                    
                    stackedOverlaysRegistry.forEach((layer) => {
                        const iframeElement = document.getElementById(layer.id);
                        if (iframeElement && iframeElement.style.display !== "none") {
                            ctx.save();
                            ctx.fillStyle = "rgba(168, 85, 247, 0.05)";
                            ctx.fillRect(0, 0, 1920, 1080);
                            ctx.strokeStyle = "#a855f7";
                            ctx.lineWidth = 4;
                            ctx.strokeRect(10, 10, 1900, 1060);
                            ctx.restore();
                        }
                    });
                }
                compositeBufferLoop();

                const videoStream = captureCanvas.captureStream(30); 
                const videoTrack = videoStream.getVideoTracks();

                const audioElement = document.getElementById("bg-music-player");
                const audioStream = audioElement.captureStream ? audioElement.captureStream() : audioElement.mozCaptureStream();
                const audioTrack = audioStream.getAudioTracks();

                const outboundStream = new MediaStream();
                outboundStream.addTrack(videoTrack[0]);
                if (audioTrack && audioTrack.length > 0) {
                    outboundStream.addTrack(audioTrack[0]);
                }

                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: "stun:://google.com" }]
                });

                outboundStream.getTracks().forEach(track => pc.addTrack(track, outboundStream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/sdp" },
                    body: offer.sdp
                });

                if (!res.ok) throw new Error("Worker proxy endpoint dropped connection.");
                
                const answerSdp = await res.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: answerSdp }));
                
                btn.textContent = "🔴 STREAM ONLINE";
            } catch (err) {
                console.error(err);
                btn.textContent = "❌ CONNECTION ERROR";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
