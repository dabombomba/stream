<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Production Control Panel</title><style>body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#f8fafc;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:20px}h1,h2{text-transform:uppercase;letter-spacing:.05em}h1{font-size:20px;color:#94a3b8;grid-column:span 2}#left-rail,#main-workspace{display:flex;flex-direction:column;gap:15px}.card{background:#1e293b;padding:15px;border-radius:8px;border:1px solid #334155}h2{font-size:13px;margin-bottom:12px;color:#a855f7}button{background:#3b82f6;color:#fff;border:none;padding:10px 14px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;transition:background .2s}button:hover{background:#2563eb}button.active{background:#a855f7}button.danger{background:#ef4444}button.danger:hover{background:#dc2626}button.success{background:#22c55e;width:100%;padding:12px}.list-item{display:flex;align-items:center;justify-content:space-between;background:#131b2e;padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:13px}.editor-row{display:grid;grid-template-columns:90px 1fr 45px;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;font-family:monospace}input[type=range]{width:100%;accent-color:#a855f7}input[type=text],select{width:100%;padding:10px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:13px}#scene-list-box{display:flex;flex-direction:column;gap:5px}</style></head><body><h1>🎬 Stream Control Deck</h1><div id="left-rail"><div class="card" style="border-color:#22c55e"><h2>Transmission</h2><button id="liveBtn" class="success" onclick="triggerDeployment()">🚀 DEPLOY WHIP LIVE</button></div><div class="card"><h2>Scenes Manager</h2><div id="scene-list-box"></div><div style="display:flex;gap:5px;margin-top:10px"><input type="text" id="newSceneName" placeholder="New Scene Name..."><button onclick="createNewSceneProfile()">➕ Create</button></div></div><div class="card"><h2>Global Sources Vault</h2><div id="sources-vault-box"></div></div></div><div id="main-workspace"><div class="card"><h2>Hardware Router</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><div><label style="font-size:12px;color:#64748b">PRIMARY WEBCAM</label><select id="camSelect" onchange="updateHardwareRoute()"></select></div><div><label style="font-size:12px;color:#64748b">CAPTURE CARD / DISPLAY</label><select id="capSelect" onchange="updateHardwareRoute()"></select></div></div></div><div class="card"><h2>Source Placement & Layer Editor</h2><div style="margin-bottom:15px;display:flex;gap:15px;align-items:center"><label style="font-size:13px">Target Layer:</label><select id="editLayerSelect" style="width:240px" onchange="syncEditorSliders()"><option value="game-feed">Game Capture Card / Display</option><option value="webcam-feed">Webcam Feed Layer</option><option value="twitch-alertbox">Twitch Alert Box Overlay</option></select><label><input type="checkbox" id="layerSceneVisibility" onchange="toggleLayerSceneVisibility()"> Include in this Scene</label></div><div class="editor-row"><span>Top Pos:</span><input type="range" id="s-top" min="0" max="100" oninput="changeProperty('top',this.value)"><span id="v-top">0%</span></div><div class="editor-row"><span>Left Pos:</span><input type="range" id="s-left" min="0" max="100" oninput="changeProperty('left',this.value)"><span id="v-left">0%</span></div><div class="editor-row"><span>Width:</span><input type="range" id="s-width" min="0" max="100" oninput="changeProperty('width',this.value)"><span id="v-width">0%</span></div><div class="editor-row"><span>Height:</span><input type="range" id="s-height" min="0" max="100" oninput="changeProperty('height',this.value)"><span id="v-height">0%</span></div><div class="editor-row"><span>Opacity:</span><input type="range" id="s-opacity" min="0" max="100" oninput="changeProperty('opacity',this.value/100)"><span id="v-opacity">1.0</span></div><div class="editor-row"><span>Z-Index:</span><input type="range" id="s-zIndex" min="1" max="10" oninput="changeProperty('zIndex',this.value)"><span id="v-zIndex">1</span></div></div><div class="card"><h2>Overlay URL Ingestion</h2><div style="display:flex;gap:10px"><input type="text" id="alertUrlInput" placeholder="Paste Twitch Alert Box / Widget URL here..."><button style="white-space:nowrap" onclick="saveAlertUrl()">🔌 Inject Web Source</button></div></div></div><script>const controlChannel=new BroadcastChannel("stream_control");const globalProductionState={activeScene:"Gameplay",hardwareConfig:{selectedCamera:"",selectedCaptureCard:""},sources:{"game-feed":{name:"Capture Card / Display",visible:!0},"webcam-feed":{name:"USB Webcam",visible:!0},"twitch-alertbox":{name:"Browser Alertbox Overlay",url:""}},scenes:{Gameplay:{"game-feed":{top:0,left:0,width:100,height:100,opacity:1,zIndex:1,visible:!0},"webcam-feed":{top:70,left:70,width:25,height:25,opacity:1,zIndex:2,visible:!0},"twitch-alertbox":{top:5,left:5,width:30,height:40,opacity:1,zIndex:3,visible:!0}},"Just Chatting":{"game-feed":{top:0,left:0,width:0,height:0,opacity:0,zIndex:1,visible:!1},"webcam-feed":{top:10,left:10,width:60,height:80,opacity:1,zIndex:2,visible:!0},"twitch-alertbox":{top:10,left:75,width:20,height:80,opacity:1,zIndex:3,visible:!0}}}};function dispatchState(){controlChannel.postMessage({command:"SYNC_PRODUCTION",value:globalProductionState})}function renderDashboardUI(){const e=document.getElementById("scene-list-box");e.innerHTML="";for(const t of Object.keys(globalProductionState.scenes)){const n=document.createElement("button");n.textContent=t,n.className=t===globalProductionState.activeScene?"active":"",n.onclick=()=>{globalProductionState.activeScene=t,renderDashboardUI(),syncEditorSliders(),dispatchState()},e.appendChild(n)}const t=document.getElementById("sources-vault-box");t.innerHTML="";for(const[e,n]of Object.entries(globalProductionState.sources)){const a=document.createElement("div");a.className="list-item",a.innerHTML=`<span>${n.name}</span><button class="${n.visible?'':'danger'}" onclick="toggleGlobalSource('${e}')">${n.visible?'👁️ Visible':'📁 Hidden'}</button>`,t.appendChild(a)}}function toggleGlobalSource(e){globalProductionState.sources[e].visible=!globalProductionState.sources[e].visible,renderDashboardUI(),dispatchState()}function createNewSceneProfile(){const e=document.getElementById("newSceneName").value.trim();e&&!globalProductionState.scenes[e]&&(globalProductionState.scenes[e]={"game-feed":{top:0,left:0,width:100,height:100,opacity:1,zIndex:1,visible:!0},"webcam-feed":{top:10,left:10,width:25,height:25,opacity:1,zIndex:2,visible:!0},"twitch-alertbox":{top:10,left:75,width:20,height:20,opacity:1,zIndex:3,visible:!0}},globalProductionState.activeScene=e,document.getElementById("newSceneName").value="",renderDashboardUI(),syncEditorSliders(),dispatchState())}function syncEditorSliders(){const e=globalProductionState.activeScene,t=document.getElementById("editLayerSelect").value,n=globalProductionState.scenes[e][t];document.getElementById("layerSceneVisibility").checked=n.visible;document.getElementById("s-top").value=n.top;document.getElementById("v-top").textContent=n.top+"%";document.getElementById("s-left").value=n.left;document.getElementById("v-left").textContent=n.left+"%";document.getElementById("s-width").value=n.width;document.getElementById("v-width").textContent=n.width+"%";document.getElementById("s-height").value=n.height;document.getElementById("v-height").textContent=n.height+"%";document.getElementById("s-opacity").value=100*n.opacity;document.getElementById("v-opacity").textContent=n.opacity;document.getElementById("s-zIndex").value=n.zIndex;document.getElementById("v-zIndex").textContent=n.zIndex}function changeProperty(e,t){const n=globalProductionState.activeScene,a=document.getElementById("editLayerSelect").value;globalProductionState.scenes[n][a][e]=parseFloat(t);document.getElementById(`v-${e}`).textContent="opacity"===e?t:t+("zIndex"===e?"":"%");dispatchState()}function toggleLayerSceneVisibility(){const e=globalProductionState.activeScene,t=document.getElementById("editLayerSelect").value;globalProductionState.scenes[e][t].visible=document.getElementById("layerSceneVisibility").checked,dispatchState()}function saveAlertUrl(){const e=document.getElementById("alertUrlInput").value.trim();e&&(globalProductionState.sources["twitch-alertbox"].url=e,dispatchState())}function updateHardwareRoute(){globalProductionState.hardwareConfig.selectedCamera=document.getElementById("camSelect").value;globalProductionState.hardwareConfig.selectedCaptureCard=document.getElementById("capSelect").value;dispatchState()}function triggerDeployment(){const e=document.getElementById("liveBtn");e.disabled=!0,e.textContent="CONNECTING PIPELINE...",sendControl("START_BROADCAST",!0)}function sendControl(e,t){controlChannel.postMessage({command:e,value:t})}async function scanSystemHardware(){try{await navigator.mediaDevices.getUserMedia({video:!0});const e=await navigator.mediaDevices.enumerateDevices(),t=document.getElementById("camSelect"),n=document.getElementById("capSelect");t.innerHTML="",n.innerHTML="";const a=e.filter(e=>"videoinput"===e.kind);a.forEach((e,a)=>{const r=document.createElement("option");r.value=e.deviceId,r.text=e.label||`Source Device ${a}`,t.appendChild(r.cloneNode(!0)),n.appendChild(r)});if(a.length>0){t.selectedIndex=0;n.selectedIndex=Math.min(1,a.length-1);globalProductionState.hardwareConfig.selectedCamera=t.value;globalProductionState.hardwareConfig.selectedCaptureCard=n.value}renderDashboardUI();syncEditorSliders();dispatchState()}catch(e){console.error(e)}}controlChannel.onmessage=e=>{"STATUS_UPDATE"===e.data.command&&(document.getElementById("liveBtn").textContent="LIVE"===e.data.value?"🔴 STREAM LIVE":"❌ DISCONNECTED")};window.addEventListener("DOMContentLoaded",scanSystemHardware);</script></body></html>
